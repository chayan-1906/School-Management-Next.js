version: '3.8'

services:
  postgress:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: chayan19062000
      POSTGRES_PASSWORD: Padma9647
      POSTGRES_DB: oakwood-academy
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: oakwood-academy-next-js
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL: postgresql://chayan19062000:Padma9647@192.168.1.108:5432/oakwood-academy
    depends_on:
      - postgres

volumes:
  postgres_data: